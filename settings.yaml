# All distances are in pixels unless stated otherwise. The rest is unitless unless stated otherwise.
Camera: 1 # 1: .ome.tif, 2: tif
Algorithm: 2 # 1 for the classical and 2 for the less accurate but faster alg.

SearchForContinuedStreamers: True 
NumberOfDirections: 2 # 1 (horizontal), 2 or 4 (including diagonals). 4 is best when the streamers are relatively thin.

Path: '''m/g*/*'''
StartingPoint: [298,13] # Default coordinates of the startingpoint 
Clickstart: True # Whether the start must be manually selected.

DarkMeasurement: False 
DarkMeasurementPath: '''m/dark.ome.tif'''

BlurrSize: 9 # Size of the gaussian blurr filter

FilterCamera2: True # Whether the image must be filtered from noise, only for camera 2.
MinvalFilterCamera2: 7

MaxvalNoise: 20 # After filtering, typically 15 for camera 1 and 2 for camera 2

# Fitting params
Rigidness: 0.995
DisplacementFactor: 0.1
MinimumBranchLengh: 20
CorrelationCoeff: 0.02
MaxBend: np.pi/1.5 
MaxDistanceMainBranch: 5
MaxDistanceSubBranch: 5
MaxDistanceToStartBranch: 1000 # in pixels^2
MaxDistmissedTop: 10 #in pixels^2

MaxDistTopsAlg2: 20

ProgressUpdateTime: 0.3 # seconds